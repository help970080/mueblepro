services:
  - type: web
    name: cobrapro
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cobrapro-db
          property: connectionString

databases:
  - name: cobrapro-db
    plan: free
