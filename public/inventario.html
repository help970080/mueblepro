<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario · MueblePro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#eef1f7;--surf-1:#fff;--surf-2:#f1f4f9;--ink:#1b2330;--dim:#5b6675;--faint:#97a2b2;--line:#dde3ec;--acc:#d99a0f;--acc-d:#a87a10;--grn:#178a55;--red:#d6432d;--blu:#2563eb;--amber:#c47a1a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Sora',system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 16px 70px}
  header.top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc-d));display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.15rem}
  .htxt h1{font-size:1.12rem;font-weight:700}
  .htxt p{font-size:.78rem;color:var(--dim)}
  .top a{margin-left:auto;font-size:.82rem;color:var(--dim);text-decoration:none;font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.kpis{grid-template-columns:1fr}}
  .kpi{background:var(--surf-1);border:1px solid var(--line);border-radius:13px;padding:15px}
  .kpi .l{font-size:.72rem;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
  .kpi .v{font-size:1.5rem;font-weight:700;margin-top:3px}
  .kpi.alert .v{color:var(--red)}
  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--surf-1);border:1px solid var(--line);border-radius:11px;padding:0 12px}
  .search input{flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:.9rem;padding:11px 0}
  .search svg{width:17px;height:17px;color:var(--faint)}
  .btn{font-family:inherit;font-size:.86rem;font-weight:600;border:1px solid var(--line);background:var(--surf-1);color:var(--ink);padding:10px 15px;border-radius:10px;cursor:pointer;white-space:nowrap}
  .btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc-d));color:#fff;border:none}
  .btn:active{transform:translateY(1px)}
  .filter{font-family:inherit;font-size:.86rem;background:var(--surf-1);border:1px solid var(--line);padding:10px 12px;border-radius:10px;cursor:pointer}
  table{width:100%;border-collapse:collapse;background:var(--surf-1);border:1px solid var(--line);border-radius:13px;overflow:hidden}
  th{text-align:left;font-size:.68rem;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--surf-2)}
  th.n,td.n{text-align:right}
  td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:.88rem;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr.agot{background:#fdf1ef}
  tr.bajo{background:#fdf8ef}
  .art-n{font-weight:600}
  .art-sku{font-size:.72rem;color:var(--faint)}
  .sucbox{display:inline-block;min-width:26px;text-align:center;font-size:.82rem;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--surf-2);margin:1px}
  .sucbox.z{color:var(--faint);font-weight:400}
  .tag{font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:5px}
  .tag.agot{background:#fde0db;color:var(--red)}
  .tag.bajo{background:#fdeccf;color:var(--amber)}
  .acc-btns{display:flex;gap:5px;justify-content:flex-end}
  .mini{padding:5px 9px;font-size:.76rem;border-radius:8px;border:1px solid var(--line);background:var(--surf-1);cursor:pointer;font-family:inherit}
  .mini.e{color:var(--grn);border-color:#bfe3cd}
  .mini.k{color:var(--blu)}
  .empty{text-align:center;padding:60px;color:var(--dim)}
  .loading{text-align:center;padding:60px;color:var(--faint)}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(15,20,30,.5);display:none;align-items:flex-start;justify-content:center;padding:24px 14px;z-index:50;overflow-y:auto}
  .ov.on{display:flex}
  .modal{background:var(--surf-1);border-radius:16px;width:100%;max-width:460px;box-shadow:0 24px 60px rgba(15,20,30,.3)}
  .modal h2{padding:16px 20px;font-size:1.02rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal h2 .x{cursor:pointer;color:var(--faint)}
  .mbody{padding:18px 20px;display:flex;flex-direction:column;gap:13px}
  .field label{display:block;font-size:.78rem;font-weight:600;color:var(--dim);margin-bottom:5px}
  .field input,.field select{width:100%;font-family:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surf-2);padding:10px 12px;border-radius:10px;outline:none}
  .field input:focus,.field select:focus{border-color:var(--acc);background:var(--surf-1)}
  .mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .kx-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:.84rem}
  .kx-row:last-child{border:none}
  .kx-t{font-weight:600}
  .kx-d{font-size:.72rem;color:var(--faint)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:.86rem;opacity:0;transition:.22s;z-index:100;max-width:88%;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">M</div>
    <div class="htxt"><h1>Inventario</h1><p id="sub">Cargando…</p></div>
    <a href="mueblepro.html">← Panel</a>
  </header>

  <div class="kpis">
    <div class="kpi"><div class="l">Artículos</div><div class="v" id="k-arts">—</div></div>
    <div class="kpi"><div class="l">Valor del inventario (costo)</div><div class="v" id="k-valor">—</div></div>
    <div class="kpi"><div class="l">Utilidad potencial (si vendes todo)</div><div class="v" id="k-util" style="color:var(--grn)">—</div></div>
    <div class="kpi alert"><div class="l">Alertas de stock</div><div class="v" id="k-alert">—</div></div>
  </div>

  <div class="toolbar">
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="q" placeholder="Buscar artículo o SKU…" oninput="render()"></div>
    <select class="filter" id="fest" onchange="render()"><option value="">Todos</option><option value="alerta">Solo alertas</option><option value="agot">Agotados</option></select>
    <button class="btn" onclick="imprimir()">🖨 Imprimir</button>
    <button class="btn" onclick="exportarExcel()">📊 Excel</button>
    <button class="btn" onclick="abrirPrecios()">💲 Actualizar precios</button>
    <button class="btn pri" onclick="abrirEntrada()">+ Entrada de mercancía</button>
  </div>

  <div id="resumen-suc"></div>
  <div id="cont"><div class="loading"><div class="spin"></div>Cargando inventario…</div></div>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const TOKEN=(()=>{try{return localStorage.getItem('mueblepro_token')}catch(e){return null}})();
const ME=(()=>{try{return JSON.parse(localStorage.getItem('mueblepro_user')||'null')}catch(e){return null}})();
if(!TOKEN){ location.replace('index.html'); }
let SUCS=[], DATA=[], RESUMEN=null, FULL=null;

async function api(method,path,body){
  const r=await fetch(path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:body?JSON.stringify(body):undefined});
  if(r.status===401){ location.replace('index.html'); throw new Error('Sesión expirada'); }
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||('Error '+r.status));
  return d;
}
const money=n=>'$'+(Number(n)||0).toLocaleString('es-MX',{maximumFractionDigits:0});
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m,e){const t=document.getElementById('toast');t.textContent=m;t.className='toast on'+(e?' err':'');setTimeout(()=>t.className='toast'+(e?' err':''),2600);}

async function cargar(){
  try{
    const d=await api('GET','/api/inventario');
    SUCS=d.sucursales||[]; DATA=d.articulos||[]; RESUMEN=d.resumenSucursal||[]; FULL=d;
    document.getElementById('k-arts').textContent=DATA.length;
    document.getElementById('k-valor').textContent=money(d.valorInventario);
    // utilidad potencial: si vendieras todo el stock de contado
    const utilPot=DATA.reduce((s,a)=>s+((a.precioContado||0)-(a.costo||0))*a.total,0);
    const kU=document.getElementById('k-util'); if(kU) kU.textContent=money(utilPot);
    document.getElementById('k-alert').textContent=d.alertas;
    document.getElementById('sub').textContent=`${SUCS.length} sucursal${SUCS.length!==1?'es':''} · umbral de alerta ≤ ${d.umbral}`;
    render(); pintarResumen();
  }catch(e){ document.getElementById('cont').innerHTML=`<div class="empty">${e.message}</div>`; }
}

function render(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const fe=document.getElementById('fest').value;
  let list=DATA.slice();
  if(fe==='alerta') list=list.filter(a=>a.agotado||a.bajo);
  else if(fe==='agot') list=list.filter(a=>a.agotado);
  if(q) list=list.filter(a=>(a.nombre||'').toLowerCase().includes(q)||(a.sku||'').toLowerCase().includes(q));
  const cont=document.getElementById('cont');
  if(!list.length){ cont.innerHTML='<div class="empty">Sin resultados.</div>'; return; }
  const sucCols=SUCS.map(s=>`<th class="n">${esc(s.nombre)}</th>`).join('');
  cont.innerHTML=`<table><thead><tr><th>Artículo</th><th class="n">Costo</th><th class="n">Venta</th><th class="n">Utilidad</th>${sucCols}<th class="n">Total</th><th class="n">Valor stock</th><th></th></tr></thead><tbody>${
    list.map(a=>{
      const cls=a.agotado?'agot':(a.bajo?'bajo':'');
      const tag=a.agotado?'<span class="tag agot">AGOTADO</span>':(a.bajo?'<span class="tag bajo">BAJO</span>':'');
      const cols=SUCS.map(s=>{const q=a.porSuc[s.id]||0;return `<td class="n"><span class="sucbox${q<=0?' z':''}">${q}</span></td>`;}).join('');
      return `<tr class="${cls}">
        <td><div class="art-n">${esc(a.nombre)} ${tag}</div><div class="art-sku">${esc(a.sku)||'sin SKU'} · ${esc(a.categoria)}</div></td>
        <td class="n">${money(a.costo)}</td>
        <td class="n">${money(a.precioContado)}</td>
        <td class="n">${utilHTML(a)}</td>
        ${cols}
        <td class="n"><b>${a.total}</b></td>
        <td class="n">${money(a.valorCosto)}</td>
        <td><div class="acc-btns"><button class="mini e" onclick="abrirEntrada(${a.id})">+ Entrada</button><button class="mini" onclick="abrirAjuste(${a.id})">Ajustar</button><button class="mini k" onclick="verKardex(${a.id})">Kardex</button></div></td>
      </tr>`;
    }).join('')
  }</tbody></table>`;
}

function utilHTML(a){
  const gan=(a.precioContado||0)-(a.costo||0);
  const margen=a.precioContado>0?Math.round(gan/a.precioContado*100):0;
  if(!a.costo) return '<span style="color:var(--faint)">—</span>';
  const col=gan>0?'var(--grn)':'var(--red)';
  return `<span style="color:${col};font-weight:600">${money(gan)}</span><div style="font-size:.68rem;color:var(--faint)">${margen}%</div>`;
}
function sucOptions(sel){ return SUCS.map(s=>`<option value="${s.id}"${s.id===sel?' selected':''}>${esc(s.nombre)}</option>`).join(''); }

function abrirEntrada(artId){
  const arts=DATA.map(a=>`<option value="${a.id}"${a.id===artId?' selected':''}>${esc(a.nombre)}${a.sku?' ('+esc(a.sku)+')':''}</option>`).join('');
  document.getElementById('modal').innerHTML=`
    <h2>Entrada de mercancía<span class="x" onclick="cerrar()">✕</span></h2>
    <div class="mbody">
      <div class="field"><label>Artículo</label><select id="e-art">${arts}</select></div>
      <div class="field"><label>Sucursal que recibe</label><select id="e-suc">${sucOptions(SUCS[0]&&SUCS[0].id)}</select></div>
      <div class="field"><label>Cantidad que entra</label><input id="e-cant" type="number" inputmode="numeric" placeholder="Ej. 10"></div>
      <div class="field"><label>Costo unitario (opcional, actualiza el costo)</label><input id="e-costo" type="number" inputmode="decimal" placeholder="Ej. 3000"></div>
      <div class="field"><label>Nota (proveedor, factura…)</label><input id="e-nota" placeholder="Opcional"></div>
    </div>
    <div class="mfoot"><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn pri" id="e-btn" onclick="guardarEntrada()">Registrar entrada</button></div>`;
  document.getElementById('ov').classList.add('on');
}
async function guardarEntrada(){
  const body={articuloId:+document.getElementById('e-art').value,sucursalId:+document.getElementById('e-suc').value,cantidad:+document.getElementById('e-cant').value||0,costoUnitario:+document.getElementById('e-costo').value||0,nota:document.getElementById('e-nota').value.trim()};
  if(!(body.cantidad>0)) return toast('La cantidad debe ser mayor a cero',true);
  const btn=document.getElementById('e-btn'); btn.disabled=true;
  try{ const d=await api('POST','/api/inventario/entrada',body); toast(`✓ +${body.cantidad} · ${d.articulo} (quedan ${d.existencias})`); cerrar(); cargar(); }
  catch(e){ toast(e.message,true); btn.disabled=false; }
}

function abrirAjuste(artId){
  const a=DATA.find(x=>x.id===artId);
  document.getElementById('modal').innerHTML=`
    <h2>Ajustar existencias<span class="x" onclick="cerrar()">✕</span></h2>
    <div class="mbody">
      <div style="font-size:.9rem;font-weight:600">${esc(a.nombre)}</div>
      <div class="field"><label>Sucursal</label><select id="aj-suc" onchange="ajRefleja(${artId})">${sucOptions(SUCS[0]&&SUCS[0].id)}</select></div>
      <div class="field"><label>Existencias reales (conteo físico)</label><input id="aj-cant" type="number" inputmode="numeric" value="${a.porSuc[SUCS[0]&&SUCS[0].id]||0}"></div>
      <div class="field"><label>Motivo</label><input id="aj-mot" placeholder="Merma, corrección de conteo, daño…"></div>
    </div>
    <div class="mfoot"><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn pri" id="aj-btn" onclick="guardarAjuste(${artId})">Guardar ajuste</button></div>`;
  document.getElementById('ov').classList.add('on');
}
function ajRefleja(artId){ const a=DATA.find(x=>x.id===artId); const suc=+document.getElementById('aj-suc').value; document.getElementById('aj-cant').value=a.porSuc[suc]||0; }
async function guardarAjuste(artId){
  const body={articuloId:artId,sucursalId:+document.getElementById('aj-suc').value,nuevaCantidad:+document.getElementById('aj-cant').value||0,motivo:document.getElementById('aj-mot').value.trim()};
  if(!body.motivo) return toast('Indica el motivo del ajuste',true);
  const btn=document.getElementById('aj-btn'); btn.disabled=true;
  try{ const d=await api('POST','/api/inventario/ajuste',body); toast(`✓ ${d.articulo} → ${d.existencias}`); cerrar(); cargar(); }
  catch(e){ toast(e.message,true); btn.disabled=false; }
}

async function verKardex(artId){
  try{
    const d=await api('GET','/api/inventario/'+artId+'/kardex');
    const lbl={entrada:'Entrada',venta:'Venta',devolucion:'Devolución',ajuste:'Ajuste',traspaso_entrada:'Traspaso ↓',traspaso_salida:'Traspaso ↑',venta_sin_stock:'Venta sin stock'};
    const sucName=id=>{const s=SUCS.find(x=>x.id===+id);return s?s.nombre:('Suc '+id);};
    const rows=(d.kardex||[]).map(m=>{
      const f=m.ts?new Date(m.ts).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      const signo=m.delta>0?'+':'';
      const col=m.delta>0?'var(--grn)':'var(--red)';
      return `<div class="kx-row"><div><div class="kx-t">${lbl[m.tipo]||m.tipo}</div><div class="kx-d">${f} · ${sucName(m.sucursalId)} ${m.por?'· '+esc(m.por):''} ${m.motivo?'· '+esc(m.motivo):''} ${m.folio?'· '+esc(m.folio):''}</div></div><div style="text-align:right;font-weight:700;color:${col}">${signo}${m.delta}<div class="kx-d">→ ${m.despues}</div></div></div>`;
    }).join('');
    document.getElementById('modal').innerHTML=`
      <h2>Kardex · ${esc(d.articulo)}<span class="x" onclick="cerrar()">✕</span></h2>
      <div class="mbody" style="max-height:60vh;overflow-y:auto">${rows||'<div style="color:var(--faint);text-align:center;padding:20px">Sin movimientos registrados aún.</div>'}</div>
      <div class="mfoot"><button class="btn" onclick="cerrar()">Cerrar</button></div>`;
    document.getElementById('ov').classList.add('on');
  }catch(e){ toast(e.message,true); }
}
let _preview=null;
function abrirPrecios(){
  const cats=[...new Set(DATA.map(a=>a.categoria))].sort();
  const catOpts='<option value="__todas__">Todas las categorías</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  document.getElementById('modal').innerHTML=`
    <h2>Actualizar precios<span class="x" onclick="cerrar()">✕</span></h2>
    <div class="mbody">
      <div class="field"><label>Modo</label>
        <select id="pm-modo" onchange="pmLabel()">
          <option value="margen">Fijar precio = costo + margen %</option>
          <option value="incremento">Subir el precio actual un %</option>
        </select>
      </div>
      <div class="field"><label id="pm-lbl">Margen sobre el costo (%)</label>
        <input id="pm-val" type="number" inputmode="decimal" placeholder="Ej. 40" oninput="_preview=null">
      </div>
      <div class="field"><label>Aplicar a</label><select id="pm-cat">${catOpts}</select></div>
      <div class="field"><label>Redondeo</label>
        <select id="pm-red">
          <option value="entero">Al entero</option>
          <option value="10">A múltiplos de 10</option>
          <option value="50">A múltiplos de 50</option>
          <option value="99">Terminación en 99</option>
        </select>
      </div>
      <div id="pm-prev" style="font-size:.82rem"></div>
    </div>
    <div class="mfoot">
      <button class="btn" onclick="cerrar()">Cancelar</button>
      <button class="btn" id="pm-prevbtn" onclick="pmPreview()">Vista previa</button>
      <button class="btn pri" id="pm-apply" onclick="pmAplicar()" style="display:none">Aplicar</button>
    </div>`;
  document.getElementById('ov').classList.add('on');
}
function pmLabel(){ document.getElementById('pm-lbl').textContent = document.getElementById('pm-modo').value==='margen' ? 'Margen sobre el costo (%)' : 'Porcentaje de aumento (%)'; _preview=null; }
function pmBody(preview){
  return { modo:document.getElementById('pm-modo').value, valor:+document.getElementById('pm-val').value||0,
    categoria:document.getElementById('pm-cat').value, redondeo:document.getElementById('pm-red').value, soloPreview:preview };
}
async function pmPreview(){
  const b=pmBody(true);
  if(!b.valor && b.valor!==0) return toast('Captura el porcentaje',true);
  try{
    const d=await api('POST','/api/inventario/precios-masivo',b);
    _preview=d;
    const filas=d.cambios.map(c=>{
      if(c.omitido) return `<div style="display:flex;justify-content:space-between;color:var(--faint);padding:3px 0"><span>${esc(c.nombre)}</span><span>— ${c.omitido}</span></div>`;
      const col=c.dif>0?'var(--grn)':(c.dif<0?'var(--red)':'var(--dim)');
      return `<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--line)"><span>${esc(c.nombre)}</span><span>${money(c.antes)} → <b style="color:${col}">${money(c.nuevo)}</b></span></div>`;
    }).join('');
    document.getElementById('pm-prev').innerHTML=`<div style="border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;max-height:200px;overflow-y:auto">${filas}</div><div style="margin-top:8px;color:var(--dim)"><b>${d.total}</b> se actualizarán${d.omitidos?` · ${d.omitidos} omitidos (sin costo)`:''}</div>`;
    document.getElementById('pm-apply').style.display = d.total>0 ? 'inline-block' : 'none';
  }catch(e){ toast(e.message,true); }
}
async function pmAplicar(){
  if(!_preview){ return toast('Primero da vista previa',true); }
  if(!confirm(`Se actualizarán ${_preview.total} precios. ¿Continuar?`)) return;
  const btn=document.getElementById('pm-apply'); btn.disabled=true;
  try{
    const d=await api('POST','/api/inventario/precios-masivo',pmBody(false));
    toast(`✓ ${d.afectados} precios actualizados`);
    cerrar(); cargar();
  }catch(e){ toast(e.message,true); btn.disabled=false; }
}
function pintarResumen(){
  if(!FULL) return;
  const el=document.getElementById('resumen-suc');
  if(!RESUMEN.length || SUCS.length<=1){ el.innerHTML=''; return; }
  const filas=RESUMEN.filter(s=>s.unidades>0).map(s=>`<tr>
    <td><b>${esc(s.nombre)}</b></td><td class="n">${s.unidades}</td>
    <td class="n">${money(s.valorCosto)}</td><td class="n">${money(s.valorVenta)}</td>
    <td class="n" style="color:var(--grn);font-weight:600">${money(s.utilidad)}</td></tr>`).join('');
  el.innerHTML=`<div style="background:var(--surf-1);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:16px">
    <div style="font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);margin-bottom:10px">Valor del inventario por sucursal</div>
    <table style="width:100%;border-collapse:collapse;font-size:.86rem">
      <thead><tr><th style="text-align:left;font-size:.66rem;color:var(--faint);padding:6px">SUCURSAL</th><th style="text-align:right;font-size:.66rem;color:var(--faint);padding:6px">UNIDADES</th><th style="text-align:right;font-size:.66rem;color:var(--faint);padding:6px">VALOR COSTO</th><th style="text-align:right;font-size:.66rem;color:var(--faint);padding:6px">VALOR VENTA</th><th style="text-align:right;font-size:.66rem;color:var(--faint);padding:6px">UTILIDAD</th></tr></thead>
      <tbody>${filas}</tbody>
      <tfoot><tr style="border-top:2px solid var(--line);font-weight:700"><td style="padding:8px 6px">TOTAL</td><td class="n" style="padding:8px 6px">${FULL.unidadesTotal}</td><td class="n" style="padding:8px 6px">${money(FULL.valorCostoTotal)}</td><td class="n" style="padding:8px 6px">${money(FULL.valorVentaTotal)}</td><td class="n" style="padding:8px 6px;color:var(--grn)">${money(FULL.utilidadPotencial)}</td></tr></tfoot>
    </table></div>`;
}

function imprimir(){
  if(!FULL) return;
  const fecha=new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const marca=(()=>{try{return (JSON.parse(localStorage.getItem('mueblepro_brand')||'{}').nombre)||'MueblePro'}catch(e){return 'MueblePro'}})();
  const sucCols=SUCS.map(s=>`<th class="r">${esc(s.nombre)}</th>`).join('');
  const filas=DATA.map(a=>{
    const cols=SUCS.map(s=>`<td class="r">${a.porSuc[s.id]||0}</td>`).join('');
    return `<tr><td>${esc(a.nombre)}<br><small>${esc(a.sku)||''}</small></td><td class="r">${money(a.costo)}</td><td class="r">${money(a.precioContado)}</td>${cols}<td class="r"><b>${a.total}</b></td><td class="r">${money(a.valorCosto)}</td><td class="r">${money(a.valorVenta)}</td></tr>`;
  }).join('');
  const resSuc=RESUMEN.filter(s=>s.unidades>0).map(s=>`<tr><td>${esc(s.nombre)}</td><td class="r">${s.unidades}</td><td class="r">${money(s.valorCosto)}</td><td class="r">${money(s.valorVenta)}</td><td class="r">${money(s.utilidad)}</td></tr>`).join('');
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Inventario ${marca}</title><style>
    body{font-family:Arial,sans-serif;color:#1b2330;padding:22px;max-width:1000px;margin:auto;font-size:12px}
    h1{font-size:18px;margin:0}.sub{color:#5b6675;font-size:12px;margin:3px 0 16px}
    .kpis{display:flex;gap:14px;margin-bottom:18px;flex-wrap:wrap}
    .k{border:1px solid #dde3ec;border-radius:8px;padding:10px 14px;min-width:140px}
    .k .l{font-size:10px;color:#97a2b2;text-transform:uppercase}.k .v{font-size:17px;font-weight:700;margin-top:2px}
    table{width:100%;border-collapse:collapse;margin-bottom:20px}
    th,td{border-bottom:1px solid #dde3ec;padding:6px 8px;text-align:left}
    th{background:#eef2f8;font-size:9.5px;text-transform:uppercase}.r{text-align:right}
    tfoot td{font-weight:700;border-top:2px solid #999}small{color:#97a2b2}
    h2{font-size:13px;margin:16px 0 8px}@media print{button{display:none}}</style></head><body>
    <h1>${marca} · Reporte de inventario</h1>
    <div class="sub">Generado el ${fecha}</div>
    <div class="kpis">
      <div class="k"><div class="l">Unidades</div><div class="v">${FULL.unidadesTotal}</div></div>
      <div class="k"><div class="l">Valor a costo</div><div class="v">${money(FULL.valorCostoTotal)}</div></div>
      <div class="k"><div class="l">Valor a venta</div><div class="v">${money(FULL.valorVentaTotal)}</div></div>
      <div class="k"><div class="l">Utilidad potencial</div><div class="v" style="color:#178a55">${money(FULL.utilidadPotencial)}</div></div>
    </div>
    ${resSuc?`<h2>Por sucursal</h2><table><thead><tr><th>Sucursal</th><th class="r">Unidades</th><th class="r">Costo</th><th class="r">Venta</th><th class="r">Utilidad</th></tr></thead><tbody>${resSuc}</tbody></table>`:''}
    <h2>Detalle de artículos</h2>
    <table><thead><tr><th>Artículo</th><th class="r">Costo</th><th class="r">Venta</th>${sucCols}<th class="r">Total</th><th class="r">Val. costo</th><th class="r">Val. venta</th></tr></thead><tbody>${filas}</tbody></table>
    <button onclick="window.print()" style="padding:8px 16px;font-size:13px;cursor:pointer">🖨 Imprimir</button>
    </body></html>`;
  const w=window.open('','_blank'); if(!w){ toast('Permite ventanas emergentes',true); return; }
  w.document.write(html); w.document.close();
}

function exportarExcel(){
  if(!FULL) return;
  // CSV con BOM para que Excel abra acentos bien
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const sucH=SUCS.map(s=>q(s.nombre));
  let csv=['\ufeff'+['Artículo','SKU','Categoría','Costo','Precio venta',...sucH,'Total unidades','Valor costo','Valor venta','Utilidad'].map(q).join(',')];
  DATA.forEach(a=>{
    const cols=SUCS.map(s=>a.porSuc[s.id]||0);
    csv.push([a.nombre,a.sku,a.categoria,a.costo,a.precioContado,...cols,a.total,a.valorCosto,a.valorVenta,a.utilidad].map(q).join(','));
  });
  csv.push('');
  csv.push([q('RESUMEN POR SUCURSAL')].join(','));
  csv.push(['Sucursal','Unidades','Valor costo','Valor venta','Utilidad'].map(q).join(','));
  RESUMEN.forEach(s=>csv.push([s.nombre,s.unidades,s.valorCosto,s.valorVenta,s.utilidad].map(q).join(',')));
  csv.push(['TOTAL',FULL.unidadesTotal,FULL.valorCostoTotal,FULL.valorVentaTotal,FULL.utilidadPotencial].map(q).join(','));
  const blob=new Blob([csv.join('\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='inventario_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click(); URL.revokeObjectURL(url);
  toast('Descargando Excel…');
}

function cerrar(){ document.getElementById('ov').classList.remove('on'); }
document.getElementById('ov').addEventListener('click',e=>{ if(e.target.id==='ov') cerrar(); });
cargar();
</script>
